<!-- ヘッダーのブランドマーク（Base.astro の .brand-mark）と同じ形。
     ★こちらは CSS が届かないので `--accent` と同じ色を直に書いてある。
     `--accent` を変えたらここも変えること。 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="9" fill="#1d6091"/>
  <g fill="#fff">
    <rect x="6" y="20" width="4" height="6" rx="1.5"/>
    <rect x="12" y="14" width="4" height="12" rx="1.5"/>
    <rect x="18" y="8" width="4" height="18" rx="1.5"/>
    <rect x="24" y="17" width="3" height="9" rx="1.5"/>
  </g>
</svg>

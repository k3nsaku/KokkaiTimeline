<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>sql.js-httpvfs 計測 — KokkaiTimeline Phase 1 §3.1</title>
<style>
  body { font-family: system-ui, "Segoe UI", "Yu Gothic UI", sans-serif;
         margin: 2rem auto; max-width: 76rem; padding: 0 1rem; line-height: 1.6; }
  h1 { font-size: 1.3rem; }
  .note { color: #555; font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; font-size: .88rem; margin-top: 1rem; }
  th, td { border: 1px solid #ccc; padding: .3rem .5rem; text-align: right; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  thead th { background: #f2f2f2; position: sticky; top: 0; }
  tr.bad td { background: #fde8e8; }
  tr.warn td { background: #fff6e0; }
  button { padding: .5rem 1rem; font-size: 1rem; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: .8rem;
         white-space: pre-wrap; background: #fafafa; border: 1px solid #ddd;
         padding: .5rem; max-height: 14rem; overflow: auto; }
  #json { font-family: ui-monospace, Consolas, monospace; font-size: .75rem;
          white-space: pre-wrap; background: #f6f8fa; border: 1px solid #ddd; padding: .5rem; }
  label { margin-right: 1rem; }
</style>
</head>
<body>
<h1>sql.js-httpvfs 計測 — 年ごとDB（約370MB）が実用速度を出せるか</h1>
<p class="note">
  リクエスト数はサーバ側（<code>server.js</code>）で数えている。ワーカ内の通信は
  ページから差し替えられないため。各シナリオは<strong>毎回ワーカを作り直して</strong>
  コールドで測り、続けて同じ問い合わせをウォームで測る。
</p>

<p>
  <label>DB
    <select id="db"></select>
  </label>
  <label>requestChunkSize
    <select id="chunk">
      <option>1024</option>
      <option>4096</option>
      <option selected>8192</option>
      <option>16384</option>
      <option>32768</option>
    </select>
  </label>
  <label>1リクエストに入れる遅延(ms)
    <input id="rtt" type="number" value="20" min="0" step="5" style="width:5rem">
  </label>
  <button id="run">全シナリオを実行</button>
  <button id="runAll">チャンクサイズ5種を通しで実行</button>
  <button id="runCross">年またぎ検索を計測</button>
</p>

<div id="out"></div>
<h2 style="font-size:1rem">ログ</h2>
<div id="log"></div>
<h2 style="font-size:1rem">JSON</h2>
<div id="json"></div>

<script src="./vendor/index.js"></script>
<script src="./bench.js"></script>
</body>
</html>

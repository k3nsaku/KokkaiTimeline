# 日次更新。前月と当月の会議録を取り直し、その期間のDBを作り直して R2 とサイトへ配る。
#
# 設計の前提は2つ:
#   - **常時稼働プロセスを持たない。** ここが唯一の定期実行で、落ちても数日放置できる
#   - **触った期間のDBだけ作り直す。** 閉じた期間は変わらないので CDN キャッシュが効き続ける
#
# ★ **外に出すものは、検証を全部終えてから出す。**
#   R2 と Pages に配ってしまうと取り消せないので、
#
#       作る → 検証する（verify_dist.py / npm run check / npm run build）
#            → 議員ID台帳を push → R2 → Pages
#
#   の順にしてある。完全な同時更新はできないが、**落ちたものを公開しない**順序にはできる。
#   議員ID台帳が公開より前にあるのは、**失うと公開後のURLが全部変わる**ため
#   （新しい議員IDでページを配ったのに台帳が残らないと、翌日に採番がやり直しになる）。
#
# 配信DBは半期で割ってある（`2026H1` = 1〜6月）。2文字語の索引は本文から
# その場で作るので、**期間ごとに中身が違ってよい**（以前あった「語彙が年をまたいで
# 食い違うと過去年が黙って0件になる」事故は、この設計では起きない）。
#
# 手順と Cloudflare 側の設定は docs/PIPELINE.md。

name: 日次更新

on:
  schedule:
    # UTC 20:00 = JST 翌05:00。会議録APIへの負荷が低い時間に寄せる
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      all_years:
        description: "全期間のDBを作り直す（争点語や分割の単位を変えたとき）"
        type: boolean
        default: false

# 前の実行が走っているうちに次を始めない。R2 と議員ID台帳を二重に書く事故を防ぐ
concurrency:
  group: daily-update
  cancel-in-progress: false

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # R2 は S3 互換。aws-cli はランナーに入っているので追加インストールは要らない
  R2: --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  # aws-cli v2 の新しめのものは既定でチェックサムヘッダを送る。R2 がそれを
  # 受け付けずに落ちる例があるので、要求されたときだけ付ける設定にしておく。
  # ランナーの aws-cli は勝手に上がるので、こちらで固定しておかないと
  # **ある日突然日次更新が落ちる**
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
  STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}

jobs:
  update:
    runs-on: ubuntu-latest
    # 取得は NDL への3秒間隔が効くので、会期中は1か月あたり30分近くかかることがある
    timeout-minutes: 180
    permissions:
      # 議員ID台帳（data/politician_ids.json）を書き戻すため。
      # **これを失うと公開後のURLが全部変わる**ので、書けないなら失敗させる
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 日付を決める
        id: when
        run: |
          set -euo pipefail
          today=$(date -u -d '9 hours' +%Y-%m-%d)
          # **前月1日から取り直す。** 当月だけだと、月末の会議録が翌月に公開された分と、
          # 前月以前に入った訂正を二度と拾えない（該当月の NDJSON が完成済み扱いになる）
          from=$(date -u -d "$(date -u -d '9 hours' +%Y-%m-01) -1 month" +%Y-%m-%d)
          # 配信DBは**半期**で割ってある（scripts/build_db.py の period_of()）。
          # 作り直すのは触った日付が入る期間だけ。7月と1月は前の期間もまたぐ
          half() { [ "${1:5:2}" -le 06 ] && echo "${1:0:4}H1" || echo "${1:0:4}H2"; }
          {
            echo "today=$today"
            echo "from=$from"
            echo "period=$(half "$today")"
            echo "from_period=$(half "$from")"
          } >> "$GITHUB_OUTPUT"

      # --- 前回の状態を戻す ---------------------------------------------------
      #
      # 生データと生成物はリポジトリに入れていない（.gitignore）。R2 が保管庫。

      - name: 生データと生成物を R2 から復元
        run: |
          set -euo pipefail
          mkdir -p data/raw/speeches data/dist
          aws s3 sync "s3://$STATE_BUCKET/raw/speeches" data/raw/speeches $R2 --no-progress
          # ★ 名寄せの材料。**無いと build_politicians.py がその場で終了する**
          #   （data/raw/ は .gitignore なので、リポジトリからは絶対に来ない）
          aws s3 cp "s3://$STATE_BUCKET/raw/wikidata_members.json" \
            data/raw/wikidata_members.json $R2 || true
          aws s3 cp "s3://$STATE_BUCKET/raw/wikidata_terms.json" \
            data/raw/wikidata_terms.json $R2 || true
          # 初回はまだ無い。無ければ作り直すので落とさない
          aws s3 cp "s3://$STATE_BUCKET/politicians.json" data/politicians.json $R2 || true
          # 閉じた期間のDBは落とさない（2GBある）。目録だけ戻せば、
          # write_manifest() が手元に無い期間の記載を引き継ぐ
          aws s3 cp "s3://$PUBLIC_BUCKET/manifest.json" data/dist/manifest.json $R2 || true
          du -sh data/raw/speeches

      # --- 取得と構築 ---------------------------------------------------------

      - name: Wikidata の議員リスト（無いときと月初だけ取り直す）
        # SPARQL エンドポイントは共用資源なので毎日は叩かない（5秒間隔・数分かかる）。
        # ただし**無ければ必ず取る**。無いまま進むと議員マスタの更新で止まる。
        # 手元にあるなら、取り直しに失敗しても前回ぶんで続ける（Wikidata の一時障害で
        # 日次更新ごと落とさない）。
        #
        # ★ **取れたその場で状態バケットへ書き戻す。** これは公開物ではなく入力の
        #   キャッシュで、最後まで持ち回る理由が無い。ジョブの終わりに回すと、
        #   月初の実行がそこで落ちたときに古いリストが残り、
        #   **翌月まで取り直しの機会が来ない**（取り直すのは日が 01 のときだけなので、
        #   `fetch_range --force` のように翌日に自然に追いつかない）
        run: |
          save() {
            aws s3 cp data/raw/wikidata_members.json \
              "s3://$STATE_BUCKET/raw/wikidata_members.json" $R2
            aws s3 cp data/raw/wikidata_terms.json \
              "s3://$STATE_BUCKET/raw/wikidata_terms.json" $R2
          }
          if [ ! -f data/raw/wikidata_members.json ] || [ ! -f data/raw/wikidata_terms.json ]; then
            echo "議員リストが無いので取得する"
            python scripts/fetch_wikidata.py
            save
          elif [ "$(date -u -d '9 hours' +%d)" = "01" ]; then
            if python scripts/fetch_wikidata.py; then
              save
            else
              echo "★ 月初の取り直しに失敗。前回の議員リストで続ける"
            fi
          else
            echo "前回の議員リストを使う"
          fi

      - name: 前月と当月の会議録を取り直す
        run: |
          python scripts/fetch_range.py \
            --from "${{ steps.when.outputs.from }}" \
            --until "${{ steps.when.outputs.today }}" \
            --force

      - name: 集計の材料になる単一DBを作り直す
        # 全文検索の索引はここでは要らない（配信用の期間DBにだけ張る）。
        # --no-fts で構築時間とディスクを大きく節約できる
        run: python scripts/build_db.py --fresh --no-fts

      - name: 議員マスタを更新する
        run: python scripts/build_politicians.py

      - name: 争点語の集計と週次トレンド
        run: python scripts/build_topics.py

      - name: 頻出語レイヤー
        # 機械抽出の500語（data/dist/frequent.json）。**期間DBの作り直しは要らない**
        # （検索は既存の word_hit と FTS に流す）。実測で走査は約1分
        run: python scripts/build_frequent.py

      - name: 議員ごとの発言数の推移
        # data/dist/politician_activity.json（0.5MB・実測1秒）。
        # ★ 手順4で作った単一DBに politician_id が入っていることが前提
        #   （手順1で politicians.json を戻してから build_db を回しているので入る）。
        #   入っていなければスクリプトがその場で落ちる（黙って空を作らない）
        run: python scripts/build_activity.py

      - name: 配信用の期間DBを作り直す
        run: |
          set -euo pipefail
          if [ "${{ inputs.all_years }}" = "true" ]; then
            python scripts/build_db.py --split --page-size 8192
          else
            # 7月と1月は前の期間ぶんを取り直しているので、そちらも作り直す。
            # --id は複数指定できる。目録は出力先を走査するので他の期間は消えない
            ids="--id ${{ steps.when.outputs.period }}"
            if [ "${{ steps.when.outputs.from_period }}" != "${{ steps.when.outputs.period }}" ]; then
              ids="$ids --id ${{ steps.when.outputs.from_period }}"
            fi
            python scripts/build_db.py $ids --page-size 8192
          fi

      # --- 検証する（★ ここから先に落ちたものは1バイトも外へ出さない） ----------

      - name: 配信物を検証する
        # 期間DBの PRAGMA quick_check、目録との突き合わせ（size / version / 収録範囲）、
        # 分割規則が build_db.py と query.ts で揃っているか、
        # **FTS・2文字語・争点語の3経路を代表語で1件ずつ実際に引く**スモークテスト。
        #
        # 配信DBの大きさもここで見る。**512MB を超えたファイルは黙って
        # キャッシュされなくなる**（docs/DECISIONS.md）。エラーにならず、ただ
        # RTT が 8ms → 77ms になって検索が10倍遅くなるだけなので、手前で落とす。
        #
        # ★ 検証するのは**手元にあるDBだけ**。閉じた期間は触っていないので降ろさない
        #   （目録の記載を引き継いでいる。検証を飛ばした期間はログに出る）
        run: |
          set -euo pipefail
          if [ "${{ inputs.all_years }}" = "true" ]; then
            python scripts/verify_dist.py
          else
            ids="--id ${{ steps.when.outputs.period }}"
            if [ "${{ steps.when.outputs.from_period }}" != "${{ steps.when.outputs.period }}" ]; then
              ids="$ids --id ${{ steps.when.outputs.from_period }}"
            fi
            python scripts/verify_dist.py $ids
          fi

      - name: サイトの型検査・テストとビルド
        # 議員1,111ページと争点語82ページはビルド時に生成される。
        # 中身（politicians.json / topics.json / trending.json）が毎日変わるので、
        # サイトも毎日作り直す。
        #
        # ★ `npm run check`（astro check + テスト）を**配る前に**通す。
        #   CI（ci.yml）は `site/**` を触った push でしか走らないので、
        #   ここが「毎日必ず通る関門」になる。
        env:
          PUBLIC_DB_BASE: ${{ vars.PUBLIC_DB_BASE }}
        run: |
          set -euo pipefail
          cd site
          npm ci
          npm run check
          npm run build

      # --- 台帳を残す（★ 公開より前。失うとURLが全部変わる） --------------------

      - name: 議員ID台帳が増えていたらコミットする
        # ★ data/politician_ids.json は URL に出る議員IDの台帳。
        #   失うと採番がやり直しになり、**公開後のリンクが全部壊れる**。
        #   push できないときは黙って続けず、ジョブを失敗させる。
        #
        #   **公開より前に置いてある。** 新しい議員IDでページを配ったあとに
        #   ここが落ちると、翌日は採番からやり直しになって、
        #   前日に配ったURLが誰も指さない場所になる。
        run: |
          set -euo pipefail
          if git diff --quiet -- data/politician_ids.json; then
            echo "台帳に変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/politician_ids.json
          git commit -m "議員ID台帳を更新（日次）"
          # 台帳の push が公開の関門になったので、他の commit と競ったときに
          # 1回だけやり直す。台帳は追記しかされないので rebase で衝突しない。
          # ★ 追跡ブランチの設定に頼らず明示する（この経路はまだ一度も通っていない）
          git push origin "HEAD:$GITHUB_REF_NAME" || {
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          }

      # --- 配る（ここから先は取り消せない） -------------------------------------

      - name: 期間DBと目録を R2 へ
        run: |
          set -euo pipefail
          # DBのURLには目録に載っている世代（中身の指紋）が `?v=` で付く。
          # 中身が変われば別のURLになるので、**長く握らせてよいしパージも要らない**。
          #
          # ★ ただし `immutable` は付けない。ブラウザキャッシュに壊れたものが
          #   入ったときに Ctrl+Shift+R でも直せなくなる（実際に踏んだ。
          #   docs/PIPELINE.md「DBの差し替えとキャッシュ」）。
          #   エッジは s-maxage で1年握るので CDN の効きは落ちない
          #
          # ★ --content-type を必ず渡すこと。**省くと aws-cli が拡張子から推測する**ので、
          #   ランナーの mime データベース次第で付いたり付かなかったりする。
          #   実際 2026-08-18 の実行で kokkai-2026H2.db だけ Content-Type 無しで
          #   配られた（8/12 に上げた11本には application/vnd.sqlite3 が付いていた）。
          #   ヘッダが欠けても検索は動くこともあるので、**気づく手が無い**
          #   （だから下に配布後の検算を置いてある）
          for db in data/dist/kokkai-*.db; do
            aws s3 cp "$db" "s3://$PUBLIC_BUCKET/$(basename "$db")" $R2 --no-progress \
              --content-type "application/vnd.sqlite3" \
              --cache-control "public, max-age=3600, s-maxage=31536000"
          done
          # 目録は**DBを上げ終わってから**。先に上げると、まだ無いDBをサイトが引きにいく。
          # これだけは短くする（新しい世代に気づく入口がここしかない）
          aws s3 cp data/dist/manifest.json "s3://$PUBLIC_BUCKET/manifest.json" $R2 \
            --content-type "application/json" \
            --cache-control "public, max-age=300"

      - name: Cloudflare Pages へデプロイ
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 pages deploy site/dist \
            --project-name "${{ vars.PAGES_PROJECT }}" --branch main

      - name: 次回のための状態を R2 へ
        # 公開のあと。**外から見えないもので、落ちても翌日に自然に追いつく**ものだけを
        # ここに置く（配ったものは壊れない）:
        #   - 生データ … 差分が出るのは直近2か月ぶんだけで、翌日 `--force` で取り直す
        #   - 議員マスタ … 毎回 build_politicians.py が作り直す（戻すのは材料としてだけ）
        # ★ Wikidata の議員リストはここに置かない。**取り直すのが月初だけ**なので
        #   翌日に追いつかない。取れたその場で書き戻している（上の手順2）
        run: |
          set -euo pipefail
          aws s3 sync data/raw/speeches "s3://$STATE_BUCKET/raw/speeches" $R2 --no-progress
          aws s3 cp data/politicians.json "s3://$STATE_BUCKET/politicians.json" $R2

      - name: 配ったものを公開URLごしに検算する
        # ★ **これは関門ではない。もう配ってある。** 落ちても取り消せないので、
        #   目的は「翌朝ここを見れば、サーバ側が変かどうか推測せずに分かる」こと。
        #   だから**一番最後**に置いてある。ここで落としても
        #   Pages のデプロイと状態の書き戻しは済んでいる（＝この検算のせいで
        #   他のものが飛ばない）。落ちた実行は赤くなるので、月1回の
        #   `gh run list --workflow=daily.yml` で気づける。
        #
        #   verify_dist.py（配る前）が見るのは手元のファイル。こちらが見るのは
        #   **URLが返すもの**で、Content-Type・Accept-Ranges・Content-Length・
        #   先頭16バイト・page_size を12期間ぶん確かめる。
        #   上げ方とエッジの設定で壊れる事故は、ここでしか捕まらない。
        env:
          PUBLIC_DB_BASE: ${{ vars.PUBLIC_DB_BASE }}
        run: python scripts/verify_published.py --expect-local

      # ★ reports/ は .gitignore なので、上げないとランナーの終了と一緒に消える。
      #   要約に出しているのは**件数だけ**で、「12行あります」と分かっても中身が読めず、
      #   政党の手入力も争点語の追加も頻出語の除外も着手できない（実際にそうなっていた）。
      #   数KBなので費用の心配は無い。Actions の実行ページからそのまま開ける
      - name: 運営が読むレポートを残す
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: reports/
          retention-days: 90
          if-no-files-found: ignore

      - name: 手作業が要るものを要約に出す
        if: always()
        run: |
          {
            echo "## 日次更新 ${{ steps.when.outputs.today }}"
            echo
            echo "中身は Artifacts の \`reports\` から読める（90日保持）。"
            echo "手をつけた作業は **OPERATIONS.local.md に日付を記録する**（CLAUDE.md）。"
            echo
            if [ -f reports/party_todo.md ]; then
              echo "- 政党を手入力する必要がある会派: $(grep -c '^| ' reports/party_todo.md || true)行"
              echo "  （手順は docs/CORRECTIONS.md）"
            fi
            if [ -f reports/trending_new_terms.md ]; then
              echo "- 争点語に未登録のトレンド語: $(grep -c '^| ' reports/trending_new_terms.md || true)件"
              echo "  （足すなら **全期間のDBの作り直しが要る**。topic_id がずれるため）"
            fi
            if [ -f reports/frequent_words.md ]; then
              echo "- 頻出語の一覧: $(grep -c '^| ' reports/frequent_words.md || true)語"
              echo "  （断片や人名が混ざっていたら data/topic_denylist.json に1行足す）"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

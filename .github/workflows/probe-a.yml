name: probe-a
on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: auto
  # R2 は S3 互換。aws-cli はランナーに入っているので追加インストールは要らない
  R2: --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
  # aws-cli v2 の新しめのものは既定でチェックサムヘッダを送る。R2 がそれを
  # 受け付けずに落ちる例があるので、要求されたときだけ付ける設定にしておく。
  # ランナーの aws-cli は勝手に上がるので、こちらで固定しておかないと
  # **ある日突然日次更新が落ちる**
  AWS_REQUEST_CHECKSUM_CALCULATION: when_required
  AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
  PUBLIC_BUCKET: ${{ vars.R2_PUBLIC_BUCKET }}
  STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}

jobs:
  noop:
    runs-on: ubuntu-latest
    steps:
      - run: echo ok
